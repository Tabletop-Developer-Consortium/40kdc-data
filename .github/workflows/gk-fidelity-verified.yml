name: Grey Knights fidelity source verification
on:
  push:
    branches: [wnmitch/gk-fidelity-verified-20260904]
    paths: [.github/workflows/gk-fidelity-verified.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch source snapshots outside repository
        shell: bash
        run: |
          mkdir -p /tmp/gk-source
          curl --fail --location --retry 2 'https://assets.warhammer-community.com/eng_22-07_warhammer_40%2C000_faction_pack_grey_knights-dlzvusufhy-uialb3pko4.pdf' -o /tmp/gk-source/current-grey-knights.pdf
          curl --fail --location --retry 2 'https://raw.githubusercontent.com/wn-mitch/40kdc-abilities/main/grey-knights.json' -o /tmp/gk-source/grey-knights.json
          sha256sum /tmp/gk-source/* > /tmp/gk-source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: gk-fidelity-current-source
          path: /tmp/gk-source/
          retention-days: 3
