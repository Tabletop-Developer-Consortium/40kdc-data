name: Grey Knights fidelity source verification
on:
  push:
    branches: [wnmitch/gk-fidelity-verified-20260904]
    paths: [.github/workflows/gk-fidelity-verified.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch source snapshot outside repository
        shell: bash
        run: |
          mkdir -p /tmp/gk-source
          curl --fail --location --retry 2 'https://pub-6443f136c6fc4c60a15cc7935463d637.r2.dev/dump.json' -o /tmp/gk-source/dump.json
          sha256sum /tmp/gk-source/* > /tmp/gk-source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: gk-fidelity-datasheet-source
          path: /tmp/gk-source/
          retention-days: 1
