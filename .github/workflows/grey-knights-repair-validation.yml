name: Grey Knights repair validation workspace

on:
  push:
    branches:
      - repair/grey-knights-dsl-fidelity-20260904
    paths:
      - .github/workflows/grey-knights-repair-validation.yml

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch source snapshots outside repository
        shell: bash
        run: |
          mkdir -p /tmp/gk-source
          curl --fail --location --retry 2 https://pub-6443f136c6fc4c60a15cc7935463d637.r2.dev/dump.json -o /tmp/gk-source/dump.json
          curl --fail --location --retry 2 https://raw.githubusercontent.com/wn-mitch/40kdc-abilities/main/grey-knights.json -o /tmp/gk-source/grey-knights.json
          sha256sum /tmp/gk-source/*.json > /tmp/gk-source/checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: grey-knights-source-snapshot
          path: /tmp/gk-source/
          retention-days: 1
