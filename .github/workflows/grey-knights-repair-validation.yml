name: Grey Knights repair validation workspace
on:
  push:
    branches: [repair/grey-knights-dsl-fidelity-20260904]
    paths: [.github/workflows/grey-knights-repair-validation.yml]
permissions:
  contents: read
jobs:
  runtimes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Stage matching offline runtimes
        shell: bash
        run: |
          mkdir -p /tmp/gk-runtimes/wheels
          python -m pip wheel --wheel-dir /tmp/gk-runtimes/wheels './python[dev]'
          tar -C "$(go env GOROOT)" -czf /tmp/gk-runtimes/go-toolchain.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: grey-knights-offline-runtimes
          path: /tmp/gk-runtimes/
          retention-days: 1
