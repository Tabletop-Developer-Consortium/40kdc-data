[workspace]
resolver = "3"
members = [
  "crates/campaign-domain",
  "crates/campaign-store",
  "crates/campaign-roles",
  "crates/campaign-providers",
  "crates/campaign-executors",
  "crates/campaign-engine",
  "crates/dsl-campaign-cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
base64 = "0.22.1"
clap = { version = "4.5.53", features = ["derive", "env"] }
futures-util = "0.3.31"
hex = "0.4.3"
jsonschema = { version = "0.33.0", default-features = false }
parking_lot = "0.12.5"
regex = "1.12.2"
rusqlite = { version = "0.37.0", features = ["bundled", "serde_json", "time"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
schemars = "1.1.0"
sha2 = "0.10.9"
subtle = "2.6.1"
tempfile = "3.23.0"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "serde", "std"] }
tokio = { version = "1.48.0", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.28.0"
tracing = "0.1.41"
url = "2.5.7"
uuid = { version = "1.19.0", features = ["serde", "v4"] }
walkdir = "2.5.0"
which = "8.0.0"
rig-core = { version = "=0.41.0" }
rig-agent = { version = "=0.41.0" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
